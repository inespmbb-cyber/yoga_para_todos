<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>{{ postura['titulo'] }} - Yoga para Todos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-body">
                    <a href="/" class="btn btn-outline-secondary mb-3">← Voltar à Lista</a>
                    <h1 class="display-4 text-primary">{{ postura['titulo'] }}</h1>
                    <span class="badge bg-info mb-4">{{ postura['nivel'] }}</span>
                    
                    <h3>Sobre a postura</h3>
                    <p class="lead">{{ postura['descricao'] }}</p>
                    
                    <hr>
                    
                    <h3>Instruções passo a passo</h3>
                    <div class="p-3 bg-white border rounded">
                        {{ postura['instrucoes'] }}
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
