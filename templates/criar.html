<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Nova Postura - Yoga para Todos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <h2>Adicionar Nova Postura</h2>
    <form method="post" class="bg-white p-4 shadow-sm rounded">
        <div class="mb-3">
            <label class="form-label">Título</label>
            <input type="text" name="titulo" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Descrição Curta</label>
            <textarea name="descricao" class="form-control" rows="2" required></textarea>
        </div>
        <div class="mb-3">
            <label class="form-label">Instruções</label>
            <textarea name="instrucoes" class="form-control" rows="4" required></textarea>
        </div>
        <div class="mb-3">
            <label class="form-label">Nível</label>
            <select name="nivel" class="form-select">
                <option value="Iniciante">Iniciante</option>
                <option value="Intermédio">Intermédio</option>
                <option value="Avançado">Avançado</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Contraindicações</label>
            <input type="text" name="contraindicacoes" class="form-control" 
                placeholder="ex: hipertensão, lesão no pulso, nenhuma">
        </div>


        <div class="mb-3">
            <label class="form-label">Fase da Aula</label>
            <select name="fase_aula" class="form-select">
                <option value="Aquecimento">Aquecimento</option>
                <option value="Desenvolvimento">Desenvolvimento / Ápice</option>
                <option value="Relaxamento">Relaxamento</option>
            </select>
        </div>
        
        <button type="submit" class="btn btn-success">Guardar Postura</button>
        <a href="/" class="btn btn-link">Cancelar</a>
    </form>
</div>
</body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="/">🧘‍♀️ Yoga para Todos</a>
        <div class="navbar-nav">
            <a class="nav-link" href="/">Início</a>
            <a class="nav-link" href="{{ url_for('criar') }}">Adicionar Nova</a>
        </div>
    </div>
</nav>

<div class="container mt-3">
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}
    </div>


</html>
